name: CI

# Every pull request, and every push to main. The daily job's own commits do
# not start this: a push made with GITHUB_TOKEN never triggers other workflows.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request makes its older run pointless, so stop that one.
# Runs on main are left alone: every commit there should get a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Branch protection refers to this job by its name, `checks`. Renaming it
  # means updating the required status check on GitHub too.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        id: install
        run: pip install ".[dev]"

      # Each check runs even if an earlier one failed, so a single run reports
      # every problem rather than stopping at the first. They are skipped only
      # when the install itself failed, since then they could not run at all.
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # The github format turns findings into annotations on the PR's diff.
        run: ruff check --output-format=github .

      - name: Formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .

      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy
