[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-proverb-overlay"
version = "0.1.0"
description = "Overlay a quote onto the Wikimedia Commons Picture of the Day."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Installed by CI; harmless to have locally too.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[project.scripts]
daily-proverb-overlay = "daily_proverb_overlay.cli:main"
daily-proverb-site = "daily_proverb_overlay.site_builder:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_proverb_overlay = ["assets/fonts/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplification
    "RUF",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
# Pillow ships type hints, requests does not without types-requests.
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
